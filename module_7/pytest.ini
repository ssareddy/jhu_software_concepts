[pytest]
addopts = -q --cov=module_6/src/web/app --cov=module_6/src/worker --cov=module_6/src/db --cov-config=module_6/.coveragerc --cov-report=term-missing --cov-fail-under=100
markers =
    web: Flask route/page tests
    buttons: Pull Data and Update Analysis button behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows