name: Module 6 CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "module_6/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "module_6/**"

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r module_6/src/web/requirements.txt
          pip install -r module_6/src/worker/requirements.txt
          pip install -e module_6/src/common
          pip install setuptools
          pip install pylint

      - name: Run Pylint
        run: |
          PYTHONPATH=module_6/src:module_6/src/web:module_6/src/web/app:module_6/src/worker:module_6/src/db \
          pylint module_6/src/ \
            --rcfile=module_6/.pylintrc \
            --fail-under=10

  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r module_6/src/web/requirements.txt
          pip install -r module_6/src/worker/requirements.txt
          pip install -r module_6/requirements.txt
          pip install -e module_6/src/common

      - name: Run pytest suite with coverage
        run: |
          pytest module_6/tests \
            -m "web or buttons or analysis or db or integration" \
            --cov-config=module_6/.coveragerc \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            -q

      - name: Save coverage summary
        run: |
          pytest module_6/tests \
            -m "web or buttons or analysis or db or integration" \
            --cov-config=module_6/.coveragerc \
            --cov-report=term-missing \
            -q 2>&1 | tee module_6/coverage_summary.txt